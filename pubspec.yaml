name: inktome
description: "A privacy-first, offline book tracking app. Catalogue your
  personal library via barcode scan, search, or manual entry — no account
  required, no cloud, your data stays on your device."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cached_network_image: ^3.4.1
  dashed_border: ^1.0.2
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  flutter:
    sdk: flutter
  flutter_lucide_animated: ^0.0.4
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

dev_dependencies:
  build_runner: ^2.13.1
  drift_dev: ^2.32.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  http: ^1.6.0

flutter:
  uses-material-design: true
