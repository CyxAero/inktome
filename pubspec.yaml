name: inktome
description: "A privacy-first, offline book tracking app. Catalogue your
  personal library via barcode scan, search, or manual entry — no account
  required, no cloud, your data stays on your device."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cached_network_image: ^3.4.1
  dashed_border: ^1.0.2
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  flutter:
    sdk: flutter
  flutter_lucide_animated: ^0.0.4
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  http: ^1.6.0
  mobile_scanner: ^7.2.0
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

dev_dependencies:
  build_runner: ^2.13.1
  drift_dev: ^2.32.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: LondrinaSolid
      fonts:
        - asset: assets/fonts/LondrinaSolid-Thin.ttf
          weight: 100
        - asset: assets/fonts/LondrinaSolid-Light.ttf
          weight: 300
        - asset: assets/fonts/LondrinaSolid-Regular.ttf
          weight: 400
        - asset: assets/fonts/LondrinaSolid-Black.ttf
          weight: 900
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-VariableFont.ttf
          style: normal
        - asset: assets/fonts/Fraunces-Italic-VariableFont.ttf
          style: italic
    - family: PlaypenSans
      fonts:
        - asset: assets/fonts/PlaypenSans-VariableFont_wght.ttf
    - family: NanumPenScript
      fonts:
        - asset: assets/fonts/NanumPenScript-Regular.ttf
          weight: 400
